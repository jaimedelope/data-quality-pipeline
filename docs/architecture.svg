<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="Data quality pipeline architecture">
  <rect width="960" height="320" fill="#0b1220"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3dd6c6"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8eefc">
    <rect x="40" y="110" width="140" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="110" y="142" text-anchor="middle" font-weight="600">Generator</text>
    <text x="110" y="162" text-anchor="middle" fill="#93a0b8" font-size="11">synthetic batches</text>

    <rect x="230" y="110" width="140" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="300" y="142" text-anchor="middle" font-weight="600">Landing</text>
    <text x="300" y="162" text-anchor="middle" fill="#93a0b8" font-size="11">CSV / JSON</text>

    <rect x="420" y="110" width="140" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="490" y="142" text-anchor="middle" font-weight="600">Checker</text>
    <text x="490" y="162" text-anchor="middle" fill="#93a0b8" font-size="11">7 quality checks</text>

    <rect x="610" y="40" width="140" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="680" y="72" text-anchor="middle" font-weight="600">Redis</text>
    <text x="680" y="92" text-anchor="middle" fill="#93a0b8" font-size="11">metrics + feeds</text>

    <rect x="610" y="180" width="140" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="680" y="212" text-anchor="middle" font-weight="600">Failed feed</text>
    <text x="680" y="232" text-anchor="middle" fill="#93a0b8" font-size="11">offending rows</text>

    <rect x="800" y="110" width="120" height="70" rx="12" fill="#121a2b" stroke="#3dd6c6"/>
    <text x="860" y="142" text-anchor="middle" font-weight="600">Dashboard</text>
    <text x="860" y="162" text-anchor="middle" fill="#93a0b8" font-size="11">:8089</text>

    <line x1="180" y1="145" x2="230" y2="145" stroke="#3dd6c6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="370" y1="145" x2="420" y2="145" stroke="#3dd6c6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="560" y1="130" x2="610" y2="85" stroke="#3dd6c6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="560" y1="160" x2="610" y2="205" stroke="#ff6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="750" y1="75" x2="800" y2="130" stroke="#3dd6c6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="750" y1="215" x2="800" y2="160" stroke="#ff6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>
</svg>
