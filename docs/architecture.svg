<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Data contract scorecards architecture">
  <rect width="960" height="300" fill="#f4f1ea"/>
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif">
    <rect x="30" y="100" width="150" height="70" rx="4" fill="#fffcf7" stroke="#d6d3d1"/>
    <text x="105" y="130" text-anchor="middle" fill="#1c1917" font-size="14" font-weight="600">Generator</text>
    <text x="105" y="150" text-anchor="middle" fill="#78716c" font-size="12">landing CSVs</text>

    <path d="M180 135 H230" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>

    <rect x="230" y="100" width="150" height="70" rx="4" fill="#fffcf7" stroke="#d6d3d1"/>
    <text x="305" y="130" text-anchor="middle" fill="#1c1917" font-size="14" font-weight="600">Contracts</text>
    <text x="305" y="150" text-anchor="middle" fill="#78716c" font-size="12">YAML SLAs</text>

    <path d="M380 135 H430" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>

    <rect x="430" y="100" width="160" height="70" rx="4" fill="#fffcf7" stroke="#d6d3d1"/>
    <text x="510" y="130" text-anchor="middle" fill="#1c1917" font-size="14" font-weight="600">Validator</text>
    <text x="510" y="150" text-anchor="middle" fill="#78716c" font-size="12">checks + quarantine</text>

    <path d="M590 135 H640" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>

    <rect x="640" y="55" width="140" height="55" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="710" y="88" text-anchor="middle" fill="#166534" font-size="13" font-weight="600">processed/</text>

    <rect x="640" y="125" width="140" height="55" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="710" y="158" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="600">quarantine/</text>

    <rect x="800" y="100" width="130" height="70" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="865" y="130" text-anchor="middle" fill="#1c1917" font-size="14" font-weight="600">SQLite</text>
    <text x="865" y="150" text-anchor="middle" fill="#78716c" font-size="12">scorecards</text>

    <text x="480" y="240" text-anchor="middle" fill="#b45309" font-size="13">customers · orders · events — contract scorecards on :8090</text>
