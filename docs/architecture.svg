<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-label="Data quality pipeline architecture">
  <rect width="920" height="280" fill="#0b1220"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3dd6c6"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="90" width="160" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="120" y="122" text-anchor="middle" fill="#e8eefc" font-size="15" font-weight="600">Generator</text>
    <text x="120" y="142" text-anchor="middle" fill="#93a0b8" font-size="12">order batches</text>

    <line x1="200" y1="125" x2="260" y2="125" stroke="#3dd6c6" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="260" y="90" width="160" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="340" y="122" text-anchor="middle" fill="#e8eefc" font-size="15" font-weight="600">Redis landing</text>
    <text x="340" y="142" text-anchor="middle" fill="#93a0b8" font-size="12">landing:batches</text>

    <line x1="420" y1="125" x2="480" y2="125" stroke="#3dd6c6" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="480" y="90" width="170" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="565" y="122" text-anchor="middle" fill="#e8eefc" font-size="15" font-weight="600">Quality checker</text>
    <text x="565" y="142" text-anchor="middle" fill="#93a0b8" font-size="12">7 DQ rules</text>

    <line x1="650" y1="125" x2="710" y2="125" stroke="#3dd6c6" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="710" y="90" width="160" height="70" rx="12" fill="#121a2b" stroke="#243049"/>
    <text x="790" y="122" text-anchor="middle" fill="#e8eefc" font-size="15" font-weight="600">Dashboard</text>
    <text x="790" y="142" text-anchor="middle" fill="#93a0b8" font-size="12">:8089</text>

    <text x="460" y="230" text-anchor="middle" fill="#3dd6c6" font-size="13">schema · completeness · uniqueness · validity · freshness · referential · volume</text>
  </g>
</svg>
