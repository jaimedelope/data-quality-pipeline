services:
  generator:
    build: ./generator
    environment:
      DATA_DIR: /data
      RUN_INTERVAL_SEC: "8"
    volumes:
      - warehouse-data:/data

  validator:
    build: ./validator
    environment:
      DATA_DIR: /data
      CONTRACTS_DIR: /contracts
      POLL_INTERVAL_SEC: "3"
    volumes:
      - warehouse-data:/data
      - ./contracts:/contracts:ro
    depends_on:
      - generator

  dashboard:
    build: ./dashboard
    ports:
      - "8090:8090"
    environment:
      DATA_DIR: /data
      CONTRACTS_DIR: /contracts
    volumes:
      - warehouse-data:/data
      - ./contracts:/contracts:ro
    depends_on:
      - validator

volumes:
  warehouse-data:
